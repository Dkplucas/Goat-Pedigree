services:
  - type: web
    name: goat_project
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn goat_project.wsgi:application"
   envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: goatpedigree_db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: WEB_CONCURRENCY
        value: "4"
