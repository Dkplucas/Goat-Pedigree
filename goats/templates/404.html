{% load static %} {% load static tailwind_tags %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="404 - Page Not Found" />
    <meta name="keywords" content="404, error, page not found" />
    <meta property="og:title" content="404 - Page Not Found" />
    <meta
      property="og:description"
      content="The page you're looking for doesn't exist"
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="404 - Page Not Found" />
    <meta
      name="twitter:description"
      content="The page you're looking for doesn't exist"
    />
    <title>404 - Page Not Found</title>
    <!-- Favicons -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="{% static 'favicon/apple-touch-icon.png' %}"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="{% static 'favicon/favicon-32x32.png' %}"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="{% static 'favicon/favicon-16x16.png' %}"
    />
    <link rel="manifest" href="{% static 'favicon/site.webmanifest' %}" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    {% tailwind_css %}
    <style>
      .error-404 {
        font-size: 180px;
        font-weight: bold;
        color: #4caf50;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        animation: float 3s ease-in-out infinite;
        position: relative;
        letter-spacing: 8px;
      }

      @keyframes float {
        0% {
          transform: translateY(0px);
        }
        50% {
          transform: translateY(-20px);
        }
        100% {
          transform: translateY(0px);
        }
      }

      .error-404::after {
        content: "404";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        color: transparent;
        -webkit-text-stroke: 2px #4caf50;
        opacity: 0.5;
        animation: glitch 2s ease-in-out infinite alternate;
      }

      @keyframes glitch {
        0% {
          transform: translate(0);
        }
        20% {
          transform: translate(-2px, 2px);
        }
        40% {
          transform: translate(-2px, -2px);
        }
        60% {
          transform: translate(2px, 2px);
        }
        80% {
          transform: translate(2px, -2px);
        }
        100% {
          transform: translate(0);
        }
      }

      #particles {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="particles"></div>
    <div id="root"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/react.production.min.js' %}"></script>
    <script src="{% static 'js/react-dom.production.min.js' %}"></script>
    <script src="{% static 'js/babel.min.js' %}"></script>
    <script type="text/babel">
      function Particles() {
        try {
          React.useEffect(() => {
            const canvas = document.createElement("canvas");
            const ctx = canvas.getContext("2d");
            const container = document.getElementById("particles");

            canvas.style.position = "fixed";
            canvas.style.top = "0";
            canvas.style.left = "0";
            canvas.style.zIndex = "1";
            container.appendChild(canvas);

            let particles = [];
            const particleCount = 50;

            function resize() {
              canvas.width = window.innerWidth;
              canvas.height = window.innerHeight;
            }

            class Particle {
              constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vx = Math.random() * 2 - 1;
                this.vy = Math.random() * 2 - 1;
                this.radius = Math.random() * 3;
              }

              draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = "#4caf50";
                ctx.fill();
              }

              update() {
                this.x += this.vx;
                this.y += this.vy;

                if (this.x < 0 || this.x > canvas.width) this.vx = -this.vx;
                if (this.y < 0 || this.y > canvas.height) this.vy = -this.vy;
              }
            }

            function init() {
              particles = [];
              for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
              }
            }

            function animate() {
              ctx.clearRect(0, 0, canvas.width, canvas.height);
              particles.forEach((particle) => {
                particle.update();
                particle.draw();
              });
              requestAnimationFrame(animate);
            }

            window.addEventListener("resize", resize);
            resize();
            init();
            animate();

            return () => {
              window.removeEventListener("resize", resize);
              container.removeChild(canvas);
            };
          }, []);

          return null;
        } catch (error) {
          console.error("Particles component error:", error);
          reportError(error);
          return null;
        }
      }

      function NotFound() {
        try {
          return (
            <div
              data-name="not-found-container"
              className="min-h-screen flex items-center justify-center bg-gradient-to-b from-gray-50 to-gray-100"
            >
              <div
                data-name="content-wrapper"
                className="text-center relative z-10"
              >
                <h1 data-name="error-text" className="error-404">
                  404
                </h1>
                <p
                  data-name="error-message"
                  className="text-xl mt-4 text-gray-600 font-light"
                >
                  Oops! The page you're looking for doesn't exist
                </p>
                <a
                  data-name="home-link"
                  href="{% url 'home' %}"
                  className="inline-block mt-8 px-8 py-3 bg-[#4caf50] text-white rounded-lg hover:bg-[#45a049] transition-all duration-300 transform hover:scale-105 shadow-lg hover:shadow-xl"
                >
                  Back to Home
                </a>
              </div>
            </div>
          );
        } catch (error) {
          console.error("NotFound component error:", error);
          reportError(error);
          return null;
        }
      }

      function App() {
        try {
          return (
            <div data-name="app-container">
              <Particles />
              <NotFound />
            </div>
          );
        } catch (error) {
          console.error("App component error:", error);
          reportError(error);
          return null;
        }
      }

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    </script>
  </body>
</html>
